name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (default)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (syntax-highlight)
        run: cargo clippy --all-targets --features syntax-highlight -- -D warnings
      - name: test (default)
        run: cargo test
      - name: test (syntax-highlight)
        run: cargo test --features syntax-highlight

  web:
    name: wasm · web build · e2e · size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-pack (pinned, same as deploy/build-pages.sh)
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install web deps
        working-directory: web
        run: npm ci
      - name: build wasm (lean core + lazy highlighter)
        working-directory: web
        run: npm run build:wasm
      - name: wasm gzip size gates (core < 260 KB, lazy highlighter < 960 KB)
        run: |
          gate() {
            gz=$(gzip -9 -c "$1" | wc -c)
            echo "$1 gzip: $((gz/1024)) KB ($gz bytes)"
            [ "$gz" -le $(($2*1024)) ] || { echo "::error::$1 gzip $((gz/1024)) KB exceeds $2 KB"; exit 1; }
          }
          gate web/src/wasm/wemark_core_bg.wasm 260
          gate web/src/wasm-highlight/wemark_highlight_bg.wasm 960
      - name: typecheck + build
        working-directory: web
        run: npm run build
      - name: first-load site gzip size gate (< 300 KB, excludes lazy highlighter)
        working-directory: web
        run: |
          total=$(find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.wasm' -o -name '*.html' \) \
            ! -name 'wemark_highlight*' \
            -exec sh -c 'gzip -9 -c "$1" | wc -c' _ {} \; | awk '{s+=$1} END {print s}')
          echo "first-load gzip size: $((total/1024)) KB ($total bytes)"
          [ "$total" -le $((300*1024)) ] || { echo "::error::site gzip $((total/1024)) KB exceeds 300 KB"; exit 1; }
      - name: install Playwright (chromium + webkit + firefox)
        working-directory: web
        run: npx playwright install --with-deps chromium webkit firefox
      - name: e2e (chromium + webkit + firefox)
        working-directory: web
        run: npx playwright test
