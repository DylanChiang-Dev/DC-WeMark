name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 需要在 repo Secrets 設定：
#   CLOUDFLARE_API_TOKEN   （具 Pages 編輯權限）
#   CLOUDFLARE_ACCOUNT_ID
# 並在 Cloudflare Pages 建立名為 dc-wemark 的專案（Direct Upload）。

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 未接 Cloudflare 前不執行，避免因缺 secret 而讓每次 push 都紅。
    # 準備好後在 repo Variables 設 CF_DEPLOY=true 即啟用。
    if: ${{ vars.CF_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: build wasm
        run: wasm-pack build crates/wemark-core --target web --release --out-dir ../../web/src/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build site
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=dc-wemark
