[workspace]
resolver = "2"
members = ["crates/wemark-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/DylanChiang-Dev/DC-WeMark"

# 針對 wasm 體積最佳化；原生測試走 dev profile 不受影響
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
