# 蘋果風 — DC-WeMark 唯一精修主題
# clean-room 原創：淨白留白、亮藍重點與固定紫色章節標題。
# 深色模式相容：中性色一律取無彩色（r=g=b），且不使用漸層——
# 公眾號深色模式會把漸層拍扁成單一色標，並對帶色偏的近白底色改寫失敗。
# 所有樣式最終會被內聯到每個元素上（微信公眾號編輯器只吃 inline style）。

[meta]
id = "default"
name = "蘋果風"
description = "淨白留白、亮藍重點與紫色章節標題，適合大多數文章。"
accent = "#1677ff"

[palette]
text = "#2c2c2c"
# 次要文字不可淺於 #5c5c5c：微信深色演算法只反轉夠深的灰，較淺的中灰會原樣保留，
# 在深色底上對比僅約 3:1（以 mp-darkmode 1.2.2 實測）。
muted = "#555555"
border = "#e0e0e0"
code-bg = "#f2f2f2"
quote-bg = "#f4f4f4"
quote-text = "#525252"
table-head = "#efefef"
inline-code-text = "#b4235d"
image-bg = "#ffffff"

[root]
font-family = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\", \"Hiragino Sans GB\", \"Microsoft YaHei\", Arial, sans-serif"
font-size = "16px"
line-height = "1.9"
color = "{{text}}"
letter-spacing = "1px"
word-break = "break-word"

[elements.h1]
font-size = "28px"
font-weight = "700"
color = "{{text}}"
line-height = "1.3"
margin = "18px 0 24px"
padding-bottom = "14px"
border-bottom = "2px solid {{accent}}"
letter-spacing = "0.4px"

[elements.h2]
font-size = "20px"
font-weight = "700"
color = "#ffffff"
line-height = "1.4"
margin = "34px 0 18px"
padding = "8px 14px"
background = "#6f5df6"
border-radius = "10px"
letter-spacing = "0.4px"

[elements.h3]
font-size = "18px"
font-weight = "700"
color = "{{text}}"
line-height = "1.5"
margin = "28px 0 14px"
padding-left = "10px"
border-left = "3px solid {{accent}}"

[elements.h4]
font-size = "17px"
font-weight = "700"
color = "{{accent}}"
line-height = "1.55"
margin = "24px 0 12px"

[elements.h5]
font-size = "16px"
font-weight = "700"
color = "{{text}}"
line-height = "1.55"
margin = "20px 0 10px"

[elements.h6]
font-size = "15px"
font-weight = "700"
color = "{{muted}}"
line-height = "1.6"
margin = "18px 0 8px"

[elements.p]
margin = "18px 0"
line-height = "1.9"
color = "{{text}}"

[elements.strong]
font-weight = "700"
color = "{{accent}}"

[elements.em]
font-style = "italic"
color = "{{text}}"

[elements.del]
color = "{{muted}}"
text-decoration = "line-through"

[elements.a]
color = "{{accent}}"
font-weight = "600"
text-decoration = "none"
border-bottom = "1px solid {{accent}}"

[elements.blockquote]
margin = "22px 0"
padding = "14px 18px"
color = "{{quote-text}}"
background = "{{quote-bg}}"
border-left = "4px solid {{accent}}"
border-radius = "10px"

[elements.ul]
margin = "18px 0"
padding-left = "1.5em"

[elements.ol]
margin = "18px 0"
padding-left = "1.5em"

[elements.li]
margin = "8px 0"
line-height = "1.9"
color = "{{text}}"

[elements.hr]
height = "1px"
border = "none"
background = "{{border}}"
margin = "32px 0"

[elements.img]
display = "block"
max-width = "100%"
height = "auto"
margin = "24px auto"
padding = "6px"
background = "{{image-bg}}"
border-radius = "12px"
box-shadow = "0 8px 24px rgba(0,0,0,0.12)"

[elements.code-inline]
font-family = "\"SFMono-Regular\", Consolas, Menlo, monospace"
font-size = "90%"
color = "{{inline-code-text}}"
background = "{{code-bg}}"
padding = "3px 7px"
border-radius = "6px"
letter-spacing = "0"

[elements.table]
width = "100%"
border-collapse = "collapse"
margin = "22px 0"
font-size = "15px"
color = "{{text}}"

[elements.th]
padding = "10px 12px"
font-weight = "700"
color = "{{text}}"
background = "{{table-head}}"
border = "1px solid {{border}}"

[elements.td]
padding = "10px 12px"
color = "{{text}}"
border = "1px solid {{border}}"

[elements.footnote-sup]
color = "{{accent}}"
font-size = "12px"
padding = "0 2px"

[elements.footnote-section]
margin = "36px 0 0"
padding-top = "18px"
border-top = "1px solid {{border}}"
font-size = "14px"
color = "{{muted}}"

[elements.footnote-title]
margin = "0 0 10px"
font-size = "15px"
font-weight = "700"
color = "{{text}}"

[elements.footnote-item]
margin = "5px 0"
line-height = "1.7"
word-break = "break-all"
color = "{{muted}}"

[code]
theme = "InspiredGitHub"

[code.block]
font-family = "\"SFMono-Regular\", Consolas, Menlo, monospace"
font-size = "14px"
line-height = "1.65"
color = "{{text}}"
background = "{{code-bg}}"
padding = "16px"
margin = "22px 0"
border-radius = "10px"
border = "1px solid {{border}}"
box-shadow = "0 4px 14px rgba(0,0,0,0.06)"
# 自動換行：公眾號規範 #1.8／#2.8 會對手機上水平溢出的 <pre> 提示風險。
white-space = "pre-wrap"
word-break = "break-all"
