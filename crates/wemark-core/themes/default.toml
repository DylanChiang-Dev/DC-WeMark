# 晴川 — DC-WeMark 預設主題
# 原創設計：靛藍點綴、克制留白，適合技術與生活類長文。
# 所有樣式最終會被內聯到每個元素上（微信公眾號編輯器只吃 inline style）。

[meta]
id = "default"
name = "晴川"
description = "簡潔清爽的預設主題，靛藍點綴，適合大多數技術與生活類文章。"
accent = "#4c5bd4"

# 可被其他樣式以 {{name}} 引用的調色盤變數。
# {{accent}} 是保留變數，於執行期替換（供未來自訂強調色）。
[palette]
text = "#2f3640"
muted = "#9aa0ab"
border = "#ececf2"
code-bg = "#f6f7f9"
quote-bg = "#f7f8fc"
quote-text = "#5b616e"
th-bg = "#f4f5f8"
inline-code-text = "#d6336c"

# 根容器：整篇文章的基準字型與行高。
[root]
font-family = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\", \"Hiragino Sans GB\", \"Microsoft YaHei\", Arial, sans-serif"
font-size = "16px"
line-height = "1.75"
color = "{{text}}"
letter-spacing = "0.4px"
word-break = "break-word"

[elements.h1]
font-size = "23px"
font-weight = "700"
color = "{{text}}"
line-height = "1.4"
margin = "34px 0 18px"
padding-bottom = "10px"
border-bottom = "2px solid {{accent}}"

[elements.h2]
font-size = "20px"
font-weight = "700"
color = "{{text}}"
line-height = "1.4"
margin = "30px 0 16px"
padding-left = "10px"
border-left = "4px solid {{accent}}"

[elements.h3]
font-size = "18px"
font-weight = "600"
color = "{{text}}"
line-height = "1.5"
margin = "24px 0 12px"

[elements.h4]
font-size = "16px"
font-weight = "600"
color = "{{accent}}"
line-height = "1.5"
margin = "20px 0 10px"

[elements.h5]
font-size = "15px"
font-weight = "600"
color = "{{text}}"
line-height = "1.5"
margin = "16px 0 8px"

[elements.h6]
font-size = "14px"
font-weight = "600"
color = "{{muted}}"
line-height = "1.5"
margin = "14px 0 7px"

[elements.p]
margin = "16px 0"
line-height = "1.75"
color = "{{text}}"

[elements.strong]
font-weight = "700"
color = "{{text}}"

[elements.em]
font-style = "italic"
color = "{{text}}"

[elements.del]
color = "{{muted}}"
text-decoration = "line-through"

[elements.a]
color = "{{accent}}"
font-weight = "500"
text-decoration = "none"
border-bottom = "1px solid {{accent}}"

[elements.blockquote]
margin = "18px 0"
padding = "12px 16px"
color = "{{quote-text}}"
background = "{{quote-bg}}"
border-left = "4px solid {{accent}}"
border-radius = "0 6px 6px 0"

[elements.ul]
margin = "16px 0"
padding-left = "1.4em"

[elements.ol]
margin = "16px 0"
padding-left = "1.4em"

[elements.li]
margin = "6px 0"
line-height = "1.75"
color = "{{text}}"

[elements.hr]
height = "1px"
border = "none"
background = "{{border}}"
margin = "28px 0"

[elements.img]
display = "block"
max-width = "100%"
height = "auto"
margin = "18px auto"
border-radius = "6px"

[elements.code-inline]
font-family = "\"SFMono-Regular\", Consolas, Menlo, monospace"
font-size = "90%"
color = "{{inline-code-text}}"
background = "{{code-bg}}"
padding = "2px 6px"
border-radius = "4px"

[elements.table]
width = "100%"
border-collapse = "collapse"
margin = "18px 0"
font-size = "15px"

[elements.th]
padding = "8px 12px"
font-weight = "600"
color = "{{text}}"
background = "{{th-bg}}"
border = "1px solid {{border}}"

[elements.td]
padding = "8px 12px"
color = "{{text}}"
border = "1px solid {{border}}"

[elements.footnote-sup]
color = "{{accent}}"
font-size = "12px"
padding = "0 2px"

[elements.footnote-section]
margin = "32px 0 0"
padding-top = "16px"
border-top = "1px solid {{border}}"
font-size = "14px"
color = "{{muted}}"

[elements.footnote-title]
margin = "0 0 8px"
font-size = "15px"
font-weight = "600"
color = "{{text}}"

[elements.footnote-item]
margin = "4px 0"
line-height = "1.6"
word-break = "break-all"
color = "{{muted}}"

[code]
theme = "InspiredGitHub"

[code.block]
font-family = "\"SFMono-Regular\", Consolas, Menlo, monospace"
font-size = "14px"
line-height = "1.6"
color = "{{text}}"
background = "{{code-bg}}"
padding = "16px"
margin = "18px 0"
border-radius = "8px"
border = "1px solid {{border}}"
overflow-x = "auto"
white-space = "pre"
