# 松石 — 科技松綠（Tech 風）
# 原創設計：松石綠強調、冷靜灰藍字、等寬標記感，適合技術文與教學。

[meta]
id = "pine"
name = "松石"
description = "松石綠強調配冷靜灰藍，技術感清晰，適合教學與工程類文章。"
accent = "#0d9488"

[palette]
text = "#1f2933"
muted = "#8896a5"
border = "#e3e8ee"
code-bg = "#f2f6f5"
accent-weak = "#e0f2ef"
quote-text = "#41525f"

[root]
font-family = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\", \"Hiragino Sans GB\", \"Microsoft YaHei\", Arial, sans-serif"
font-size = "16px"
line-height = "1.78"
color = "{{text}}"
letter-spacing = "0.3px"
word-break = "break-word"

[elements.h1]
font-size = "23px"
font-weight = "700"
color = "{{text}}"
line-height = "1.4"
margin = "34px 0 18px"
padding = "0 0 0 14px"
border-left = "6px solid {{accent}}"

[elements.h2]
font-size = "19px"
font-weight = "700"
color = "{{accent}}"
line-height = "1.45"
margin = "28px 0 14px"

[elements.h3]
font-size = "17px"
font-weight = "600"
color = "{{text}}"
margin = "22px 0 11px"

[elements.h4]
font-size = "15px"
font-weight = "600"
color = "{{accent}}"
margin = "18px 0 9px"
letter-spacing = "0.5px"

[elements.h5]
font-size = "14px"
font-weight = "600"
color = "{{text}}"
margin = "16px 0 8px"

[elements.h6]
font-size = "13px"
font-weight = "600"
color = "{{muted}}"
margin = "14px 0 7px"

[elements.p]
margin = "15px 0"
line-height = "1.78"
color = "{{text}}"

[elements.strong]
font-weight = "700"
color = "{{accent}}"

[elements.em]
font-style = "italic"
color = "{{text}}"

[elements.del]
color = "{{muted}}"
text-decoration = "line-through"

[elements.a]
color = "{{accent}}"
font-weight = "500"
text-decoration = "none"
border-bottom = "1px solid {{accent}}"

[elements.blockquote]
margin = "18px 0"
padding = "12px 16px"
color = "{{quote-text}}"
background = "{{accent-weak}}"
border-left = "4px solid {{accent}}"
border-radius = "0 6px 6px 0"

[elements.ul]
margin = "15px 0"
padding-left = "1.4em"

[elements.ol]
margin = "15px 0"
padding-left = "1.4em"

[elements.li]
margin = "6px 0"
line-height = "1.78"
color = "{{text}}"

[elements.hr]
height = "1px"
border = "none"
background = "{{border}}"
margin = "28px 0"

[elements.img]
display = "block"
max-width = "100%"
height = "auto"
margin = "18px auto"
border-radius = "8px"

[elements.code-inline]
font-family = "\"SFMono-Regular\", Consolas, Menlo, monospace"
font-size = "90%"
color = "#0b7a70"
background = "{{accent-weak}}"
padding = "2px 6px"
border-radius = "4px"

[elements.table]
width = "100%"
border-collapse = "collapse"
margin = "18px 0"
font-size = "15px"

[elements.th]
padding = "8px 12px"
font-weight = "600"
color = "#ffffff"
background = "{{accent}}"
border = "1px solid {{accent}}"

[elements.td]
padding = "8px 12px"
color = "{{text}}"
border = "1px solid {{border}}"

[elements.footnote-sup]
color = "{{accent}}"
font-size = "12px"
padding = "0 2px"

[elements.footnote-section]
margin = "32px 0 0"
padding-top = "16px"
border-top = "1px solid {{border}}"
font-size = "14px"
color = "{{muted}}"

[elements.footnote-title]
margin = "0 0 8px"
font-size = "15px"
font-weight = "600"
color = "{{text}}"

[elements.footnote-item]
margin = "4px 0"
line-height = "1.6"
word-break = "break-all"
color = "{{muted}}"

[code]
theme = "base16-ocean.dark"

[code.block]
font-family = "\"SFMono-Regular\", Consolas, Menlo, monospace"
font-size = "14px"
line-height = "1.6"
color = "#c0c5ce"
background = "#2b303b"
padding = "16px"
margin = "18px 0"
border-radius = "8px"
overflow-x = "auto"
white-space = "pre"
