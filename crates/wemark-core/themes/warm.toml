# 暖陽 — 暖色手帳（Warm / Journal 風）
# 原創設計：暖橙點綴、奶油底色引言、圓潤邊角，適合生活隨筆與品牌軟文。

[meta]
id = "warm"
name = "暖陽"
description = "暖橙點綴配奶油色調，柔和手帳感，適合生活隨筆與品牌內容。"
accent = "#e0743c"

[palette]
text = "#4a3f35"
muted = "#a99b8c"
border = "#efe6dd"
code-bg = "#faf4ee"
accent-weak = "#fcefe4"
quote-text = "#7a6a58"

[root]
font-family = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\", \"Hiragino Sans GB\", \"Microsoft YaHei\", Arial, sans-serif"
font-size = "16px"
line-height = "1.82"
color = "{{text}}"
letter-spacing = "0.3px"
word-break = "break-word"

[elements.h1]
font-size = "23px"
font-weight = "700"
color = "{{text}}"
line-height = "1.4"
margin = "34px 0 18px"
text-align = "center"

[elements.h2]
font-size = "19px"
font-weight = "700"
color = "{{accent}}"
line-height = "1.45"
margin = "28px 0 14px"
padding = "6px 14px"
background = "{{accent-weak}}"
border-radius = "8px"

[elements.h3]
font-size = "17px"
font-weight = "600"
color = "{{text}}"
margin = "22px 0 11px"

[elements.h4]
font-size = "15px"
font-weight = "600"
color = "{{accent}}"
margin = "18px 0 9px"

[elements.p]
margin = "16px 0"
line-height = "1.82"
color = "{{text}}"

[elements.strong]
font-weight = "700"
color = "{{accent}}"

[elements.em]
font-style = "italic"
color = "{{text}}"

[elements.del]
color = "{{muted}}"
text-decoration = "line-through"

[elements.a]
color = "{{accent}}"
font-weight = "500"
text-decoration = "none"
border-bottom = "1px solid {{accent}}"

[elements.blockquote]
margin = "20px 0"
padding = "14px 18px"
color = "{{quote-text}}"
background = "{{accent-weak}}"
border-left = "4px solid {{accent}}"
border-radius = "10px"

[elements.ul]
margin = "16px 0"
padding-left = "1.4em"

[elements.ol]
margin = "16px 0"
padding-left = "1.4em"

[elements.li]
margin = "7px 0"
line-height = "1.82"
color = "{{text}}"

[elements.hr]
height = "2px"
border = "none"
background = "{{border}}"
border-radius = "2px"
margin = "28px 0"

[elements.img]
display = "block"
max-width = "100%"
height = "auto"
margin = "18px auto"
border-radius = "12px"

[elements.code-inline]
font-family = "\"SFMono-Regular\", Consolas, Menlo, monospace"
font-size = "90%"
color = "#c85f2a"
background = "{{accent-weak}}"
padding = "2px 6px"
border-radius = "5px"

[elements.table]
width = "100%"
border-collapse = "collapse"
margin = "18px 0"
font-size = "15px"

[elements.th]
padding = "8px 12px"
font-weight = "600"
color = "{{text}}"
background = "{{accent-weak}}"
border = "1px solid {{border}}"

[elements.td]
padding = "8px 12px"
color = "{{text}}"
border = "1px solid {{border}}"

[elements.footnote-sup]
color = "{{accent}}"
font-size = "12px"
padding = "0 2px"

[elements.footnote-section]
margin = "32px 0 0"
padding-top = "16px"
border-top = "1px solid {{border}}"
font-size = "14px"
color = "{{muted}}"

[elements.footnote-title]
margin = "0 0 8px"
font-size = "15px"
font-weight = "600"
color = "{{text}}"

[elements.footnote-item]
margin = "4px 0"
line-height = "1.6"
word-break = "break-all"
color = "{{muted}}"

[code]
theme = "InspiredGitHub"

[code.block]
font-family = "\"SFMono-Regular\", Consolas, Menlo, monospace"
font-size = "14px"
line-height = "1.6"
color = "{{text}}"
background = "{{code-bg}}"
padding = "16px"
margin = "18px 0"
border-radius = "10px"
border = "1px solid {{border}}"
overflow-x = "auto"
white-space = "pre"
