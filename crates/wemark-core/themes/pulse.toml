# 躍藍 — 明快科技節奏
# 原創設計：清亮藍、薄荷青與珊瑚紅形成層次，適合產品更新與效率內容。

[meta]
id = "pulse"
name = "躍藍"
description = "清亮藍搭配薄荷青與珊瑚紅，節奏明快，適合產品與效率內容。"
accent = "#1673d1"

[palette]
text = "#202a35"
muted = "#718096"
border = "#dce5ec"
accent-soft = "#eaf4ff"
quote-bg = "#e9f7f7"
quote-text = "#365e63"
signal = "#c2414d"
code-bg = "#101a26"
code-text = "#e5edf5"

[root]
font-family = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\", \"Hiragino Sans GB\", \"Microsoft YaHei\", Arial, sans-serif"
font-size = "16px"
line-height = "1.76"
color = "{{text}}"
letter-spacing = "0.3px"
word-break = "break-word"

[elements.h1]
font-size = "24px"
font-weight = "700"
color = "{{text}}"
line-height = "1.38"
margin = "35px 0 19px"
padding = "2px 0 2px 14px"
border-left = "5px solid {{accent}}"
border-bottom = "1px solid {{border}}"

[elements.h2]
font-size = "20px"
font-weight = "700"
color = "{{accent}}"
line-height = "1.42"
margin = "29px 0 15px"

[elements.h3]
font-size = "18px"
font-weight = "650"
color = "{{text}}"
line-height = "1.5"
margin = "24px 0 12px"
padding-bottom = "6px"
border-bottom = "2px solid {{accent-soft}}"

[elements.h4]
font-size = "16px"
font-weight = "600"
color = "{{signal}}"
line-height = "1.5"
margin = "20px 0 10px"

[elements.h5]
font-size = "15px"
font-weight = "600"
color = "{{text}}"
line-height = "1.5"
margin = "17px 0 8px"

[elements.h6]
font-size = "14px"
font-weight = "600"
color = "{{muted}}"
line-height = "1.5"
margin = "15px 0 7px"

[elements.p]
margin = "16px 0"
line-height = "1.76"
color = "{{text}}"

[elements.strong]
font-weight = "700"
color = "{{signal}}"

[elements.em]
font-style = "italic"
color = "{{text}}"

[elements.del]
color = "{{muted}}"
text-decoration = "line-through"

[elements.a]
color = "{{accent}}"
font-weight = "600"
text-decoration = "none"
border-bottom = "1px solid {{accent}}"

[elements.blockquote]
margin = "19px 0"
padding = "13px 16px"
color = "{{quote-text}}"
background = "{{quote-bg}}"
border-left = "4px solid {{accent}}"
border-radius = "0 5px 5px 0"

[elements.ul]
margin = "16px 0"
padding-left = "1.4em"

[elements.ol]
margin = "16px 0"
padding-left = "1.4em"

[elements.li]
margin = "6px 0"
line-height = "1.76"
color = "{{text}}"

[elements.hr]
height = "2px"
border = "none"
background = "{{accent-soft}}"
margin = "30px 0"

[elements.img]
display = "block"
max-width = "100%"
height = "auto"
margin = "19px auto"
border-radius = "6px"

[elements.code-inline]
font-family = "\"SFMono-Regular\", Consolas, Menlo, monospace"
font-size = "90%"
color = "#b33f4c"
background = "{{accent-soft}}"
padding = "2px 6px"
border-radius = "4px"

[elements.table]
width = "100%"
border-collapse = "collapse"
margin = "19px 0"
font-size = "15px"

[elements.th]
padding = "9px 12px"
font-weight = "600"
color = "#ffffff"
background = "{{accent}}"
border = "1px solid {{accent}}"

[elements.td]
padding = "9px 12px"
color = "{{text}}"
border = "1px solid {{border}}"

[elements.footnote-sup]
color = "{{signal}}"
font-size = "12px"
font-weight = "700"
padding = "0 2px"

[elements.footnote-section]
margin = "33px 0 0"
padding-top = "16px"
border-top = "2px solid {{accent-soft}}"
font-size = "14px"
color = "{{muted}}"

[elements.footnote-title]
margin = "0 0 8px"
font-size = "15px"
font-weight = "700"
color = "{{accent}}"

[elements.footnote-item]
margin = "4px 0"
line-height = "1.62"
word-break = "break-all"
color = "{{muted}}"

[code]
theme = "base16-ocean.dark"

[code.block]
font-family = "\"SFMono-Regular\", Consolas, Menlo, monospace"
font-size = "14px"
line-height = "1.62"
color = "{{code-text}}"
background = "{{code-bg}}"
padding = "16px"
margin = "19px 0"
border-radius = "6px"
border-top = "3px solid {{accent}}"
overflow-x = "auto"
white-space = "pre"
