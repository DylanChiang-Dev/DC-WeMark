# DC-WeMark 自架用 nginx 設定（靜態站，無後端）。
#
# 快取策略用 map 依副檔名決定，讓所有 add_header 都留在 server 層——
# 因為 nginx 的 add_header「只要某個 location 自帶 add_header 就不繼承上層」，
# 若在 location 內加快取標頭會意外丟失安全標頭。用 map 可避開這個陷阱。

map $uri $wemark_cache {
    default                                             "no-cache";
    # Vite 產出的資產帶內容雜湊，可長期不可變快取
    ~*\.(?:wasm|js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|ico)$  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # nginx 1.27 預設 mime.types 已含 application/wasm，無需自訂 types{}。

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # 全域標頭（安全 + 快取）：全部留在 server 層，確保每個回應都帶上。
    add_header Cache-Control $wemark_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # WebAssembly 需要 wasm-unsafe-eval；預覽注入 inline style 屬性需要 style 的 unsafe-inline。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
