<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DC-WeMark · Markdown 轉公眾號排版</title>
    <meta
      name="description"
      content="在瀏覽器裡把 Markdown 排版成微信公眾號文章，一鍵複製、純前端、無後端。"
    />
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand__mark">令</span>
          <div class="brand__text">
            <strong>DC-WeMark</strong>
            <span class="brand__sub">Markdown → 公眾號</span>
          </div>
        </div>

        <div class="toolbar">
          <div class="themes" id="themes" role="tablist" aria-label="主題"></div>
          <select class="select select--compact" id="backgroundQuick" aria-label="複製背景">
            <option value="warm">暖米紙</option>
            <option value="grid">方格紙</option>
            <option value="none">無背景</option>
          </select>
          <div class="widthtoggle" id="widthToggle" role="group" aria-label="預覽寬度">
            <button data-w="phone" class="is-active" type="button">手機</button>
            <button data-w="wide" type="button">寬版</button>
          </div>
          <button class="btn btn--ghost" id="importBtn" type="button" title="匯入 .md">匯入</button>
          <button class="btn btn--ghost" id="exportBtn" type="button" title="下載 .md">匯出</button>
          <button class="btn btn--ghost" id="settingsBtn" type="button">排版設定</button>
          <button class="btn btn--ghost btn--mobile" id="mobileToggle" type="button" title="切換編輯／預覽">切換預覽</button>
          <button class="btn btn--primary" id="copyBtn" type="button">複製到公眾號</button>
        </div>
      </header>

      <main class="panes">
        <section class="pane pane--editor" aria-label="Markdown 編輯器">
          <textarea
            id="editor"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            placeholder="在這裡寫 Markdown…"
          ></textarea>
        </section>

        <div class="divider" id="divider" role="separator" aria-orientation="vertical"></div>

        <section class="pane pane--preview" aria-label="公眾號預覽">
          <div class="phone" id="phone">
            <article class="preview" id="preview"></article>
          </div>
        </section>
      </main>

      <footer class="statusbar">
        <span id="wordcount">0 字</span>
        <span class="statusbar__spacer"></span>
        <span class="statusbar__copyright" aria-label="版權與作者連結">
          <span>© 2026 Dylan Chiang</span>
          <a href="https://dc.caiada.edu.kg/" target="_blank" rel="noopener noreferrer">個人首頁</a>
          <a href="https://github.com/DylanChiang-Dev" target="_blank" rel="noopener noreferrer">GitHub</a>
        </span>
        <span id="status">載入引擎中…</span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden />

    <div class="settings-overlay" id="settingsOverlay" hidden></div>
    <aside
      class="settings-panel"
      id="settingsPanel"
      role="dialog"
      aria-label="排版設定"
      aria-modal="true"
      aria-hidden="true"
      hidden
    >
      <header class="settings-panel__header">
        <div>
          <span class="settings-panel__eyebrow">文章輸出</span>
          <h2>排版設定</h2>
        </div>
        <button class="icon-btn" id="settingsClose" type="button" aria-label="關閉排版設定">×</button>
      </header>

      <div class="settings-panel__body">
        <section class="settings-section" aria-labelledby="themeSettingsTitle">
          <div class="settings-section__heading">
            <div>
              <h3 id="themeSettingsTitle">主題風格</h3>
              <p>先選結構，再用強調色做細部調整。</p>
            </div>
            <span class="count-badge"><strong id="themeTotal">48</strong> 款</span>
          </div>

          <div class="current-theme">
            <span class="current-theme__swatch" id="currentThemeSwatch"></span>
            <div>
              <span>目前主題</span>
              <strong id="currentThemeName"></strong>
              <p id="currentThemeDescription"></p>
            </div>
          </div>

          <div class="setting-tabs" role="tablist" aria-label="主題分類">
            <button class="is-active" type="button" role="tab" aria-selected="true" data-theme-group="native">常用 6</button>
            <button type="button" role="tab" aria-selected="false" data-theme-group="featured">精選 10</button>
            <button type="button" role="tab" aria-selected="false" data-theme-group="template">模板 32</button>
          </div>
          <div class="theme-gallery" id="themeGallery"></div>
        </section>

        <section class="settings-section" aria-labelledby="colorSettingsTitle">
          <div class="settings-section__heading">
            <div>
              <h3 id="colorSettingsTitle">強調色</h3>
              <p>標題、連結與重點標記的主色。</p>
            </div>
          </div>
          <div class="accent-options" id="accentOptions" role="group" aria-label="強調色"></div>
        </section>

        <section class="settings-section" aria-labelledby="editingSettingsTitle">
          <div class="settings-section__heading">
            <div>
              <h3 id="editingSettingsTitle">編輯體驗</h3>
              <p>偏好只保存在這台裝置。</p>
            </div>
          </div>

          <label class="setting-row" for="scrollSync">
            <span>
              <strong>同步捲動</strong>
              <small>編輯器與預覽區雙向跟隨</small>
            </span>
            <span class="switch">
              <input id="scrollSync" type="checkbox" role="switch" aria-label="雙向捲動同步" />
              <span class="switch__track" aria-hidden="true"></span>
            </span>
          </label>

          <div class="setting-block">
            <div class="setting-block__label">
              <strong>文章字級</strong>
              <small>正文與標題同步調整</small>
            </div>
            <div class="segmented" id="fontSizeGroup" role="group" aria-label="文章字級">
              <button type="button" data-font-size="small" aria-label="小">小 <small>14</small></button>
              <button type="button" data-font-size="medium" aria-label="中">中 <small>15</small></button>
              <button type="button" data-font-size="large" aria-label="大">大 <small>16</small></button>
            </div>
          </div>

          <div class="setting-block setting-block--stack">
            <div class="setting-block__label">
              <strong>文章字體</strong>
              <small>正文與標題</small>
            </div>
            <div class="font-family-options" id="fontFamilyGroup" role="group" aria-label="文章字體">
              <button type="button" data-font-family="theme">跟隨主題</button>
              <button type="button" data-font-family="sans">清晰黑體</button>
              <button type="button" data-font-family="serif">刊物宋體</button>
              <button type="button" data-font-family="kai">人文楷體</button>
            </div>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="exportSettingsTitle">
          <div class="settings-section__heading">
            <div>
              <h3 id="exportSettingsTitle">輸出背景</h3>
              <p>預覽與複製到公眾號的 HTML 保持一致。</p>
            </div>
          </div>

          <div class="background-options" role="radiogroup" aria-label="背景樣式">
            <label class="background-option">
              <input type="radio" name="backgroundStyle" value="warm" />
              <span class="background-option__preview is-warm"></span>
              <span><strong>暖米紙</strong><small>柔和、適合敘事內容</small></span>
            </label>
            <label class="background-option">
              <input type="radio" name="backgroundStyle" value="grid" />
              <span class="background-option__preview is-grid"></span>
              <span><strong>方格紙</strong><small>清楚、帶手帳質感</small></span>
            </label>
            <label class="background-option">
              <input type="radio" name="backgroundStyle" value="none" />
              <span class="background-option__preview is-none"></span>
              <span><strong>無背景</strong><small>透明、沿用目標樣式</small></span>
            </label>
          </div>
        </section>
      </div>
    </aside>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
