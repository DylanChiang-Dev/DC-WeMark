<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfcfc" />
    <title>DC-WeMark · Markdown 转公众号排版</title>
    <meta
      name="description"
      content="在浏览器里把 Markdown 排版成微信公众号文章，一键复制、纯前端、无后端。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-import" viewBox="0 0 20 20">
        <path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M4 13.5V16h12v-2.5" />
      </symbol>
      <symbol id="i-export" viewBox="0 0 20 20">
        <path d="M10 12V3m0 0L6.5 6.5M10 3l3.5 3.5M4 13.5V16h12v-2.5" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 20 20">
        <path d="M3.5 6h7m3 0h3M3.5 14h3m3 0h7" />
        <circle cx="12" cy="6" r="1.75" />
        <circle cx="8" cy="14" r="1.75" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 20 20">
        <path d="m5.5 5.5 9 9m0-9-9 9" />
      </symbol>
    </svg>

    <div class="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="DC-WeMark 首页">
          <span class="seal seal--brand" aria-hidden="true">记</span>
          <span class="brand__name">DC-WeMark</span>
        </a>

        <div class="topbar__view">
          <div class="segmented-bar" id="widthToggle" role="group" aria-label="预览宽度">
            <button data-w="phone" class="is-active" type="button" aria-pressed="true">手机</button>
            <button data-w="wide" type="button" aria-pressed="false">宽版</button>
          </div>
          <div class="segmented-bar segmented-bar--mobile" id="mobileToggle" role="group" aria-label="切换编辑或预览">
            <button data-view="edit" class="is-active" type="button" aria-pressed="true">编辑</button>
            <button data-view="preview" type="button" aria-pressed="false">预览</button>
          </div>
        </div>

        <div class="toolbar">
          <button class="tool" id="importBtn" type="button" aria-label="导入" title="导入 .md 文件">
            <svg aria-hidden="true"><use href="#i-import" /></svg><span>导入</span>
          </button>
          <button class="tool" id="exportBtn" type="button" aria-label="导出" title="下载为 .md 文件">
            <svg aria-hidden="true"><use href="#i-export" /></svg><span>导出</span>
          </button>
          <button class="tool" id="settingsBtn" type="button" aria-label="排版设置" title="排版设置">
            <svg aria-hidden="true"><use href="#i-settings" /></svg><span>设置</span>
          </button>
          <button class="copy" id="copyBtn" type="button" aria-label="复制到公众号">
            <span class="copy__seal" aria-hidden="true">印</span>
            <span class="copy__label--long" aria-hidden="true">复制到公众号</span>
            <span class="copy__label--short" aria-hidden="true">复制</span>
          </button>
        </div>
      </header>

      <main class="panes">
        <section class="pane pane--editor" aria-label="Markdown 编辑器">
          <textarea
            id="editor"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            aria-label="Markdown 正文"
            placeholder="在这里写 Markdown…"
          ></textarea>
        </section>

        <div
          class="divider"
          id="divider"
          role="separator"
          aria-orientation="vertical"
          aria-label="调整编辑区与预览区宽度"
          aria-valuemin="20"
          aria-valuemax="80"
          aria-valuenow="50"
          tabindex="0"
        ></div>

        <section class="pane pane--preview" aria-label="公众号预览">
          <div class="preview-bar">
            <p class="preview-bar__note" id="schemeNote" hidden>
              按微信官方开源的深色算法模拟，实际以手机为准
            </p>
            <div class="segmented-bar" id="schemeToggle" role="group" aria-label="预览配色">
              <button data-scheme="light" class="is-active" type="button" aria-pressed="true">浅色</button>
              <button data-scheme="dark" type="button" aria-pressed="false" title="模拟微信深色模式下读者看到的效果">深色</button>
            </div>
          </div>
          <div class="phone" id="phone">
            <article class="preview" id="preview"></article>
          </div>
        </section>

        <div class="stamp" id="stamp" aria-hidden="true">
          <span>复</span><span>制</span><span>完</span><span>成</span>
        </div>
      </main>

      <footer class="statusbar">
        <span class="draft-state" id="draftState" data-state="saved">
          <span class="draft-state__line" aria-hidden="true"></span>
          <span id="draftLabel">草稿已存本机</span>
        </span>
        <span id="wordcount" title="双击可清空草稿">0 字</span>
        <span id="status">载入引擎中…</span>
        <span class="statusbar__spacer"></span>
        <span class="statusbar__copyright" aria-label="版权与作者链接">
          <span>© 2026 Dylan Chiang</span>
          <a href="https://dc.caiada.edu.kg/" target="_blank" rel="noopener noreferrer">个人主页</a>
          <a href="https://github.com/DylanChiang-Dev" target="_blank" rel="noopener noreferrer">GitHub</a>
        </span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden />

    <div class="settings-overlay" id="settingsOverlay" hidden></div>
    <aside
      class="settings-panel"
      id="settingsPanel"
      role="dialog"
      aria-labelledby="settingsTitle"
      aria-modal="true"
      aria-hidden="true"
      hidden
    >
      <header class="settings-panel__header">
        <h2 id="settingsTitle">排版设置</h2>
        <button class="icon-btn" id="settingsClose" type="button" aria-label="关闭排版设置">
          <svg aria-hidden="true"><use href="#i-close" /></svg>
        </button>
      </header>

      <div class="settings-panel__body">
        <section class="settings-section" aria-labelledby="themeSettingsTitle">
          <div class="settings-section__heading">
            <div>
              <h3 id="themeSettingsTitle">主题风格</h3>
              <p>目前提供一套已完成验收的苹果风。</p>
            </div>
            <span class="count-badge"><strong id="themeTotal">1</strong> 款</span>
          </div>

          <div class="theme-gallery" id="themeGallery"></div>
        </section>

        <section class="settings-section" aria-labelledby="colorSettingsTitle">
          <div class="settings-section__heading">
            <div>
              <h3 id="colorSettingsTitle">强调色</h3>
              <p>标题、链接与重点标记的主色。</p>
            </div>
          </div>
          <div class="accent-options" id="accentOptions" role="group" aria-label="强调色"></div>
        </section>

        <section class="settings-section" aria-labelledby="editingSettingsTitle">
          <div class="settings-section__heading">
            <div>
              <h3 id="editingSettingsTitle">编辑体验</h3>
              <p>偏好只保存在这台设备。</p>
            </div>
          </div>

          <label class="setting-row" for="scrollSync">
            <span>
              <strong>同步滚动</strong>
              <small>编辑器与预览区双向跟随</small>
            </span>
            <span class="switch">
              <input id="scrollSync" type="checkbox" role="switch" aria-label="双向滚动同步" />
              <span class="switch__track" aria-hidden="true"></span>
            </span>
          </label>

          <div class="setting-block">
            <div class="setting-block__label">
              <strong>文章字号</strong>
              <small>正文与标题同步调整</small>
            </div>
            <div class="segmented" id="fontSizeGroup" role="group" aria-label="文章字号">
              <button type="button" data-font-size="small" aria-label="小">小 <small>14</small></button>
              <button type="button" data-font-size="medium" aria-label="中">中 <small>16</small></button>
              <button type="button" data-font-size="large" aria-label="大">大 <small>18</small></button>
            </div>
          </div>

          <div class="setting-block setting-block--stack">
            <div class="setting-block__label">
              <strong>文章字体</strong>
              <small>正文与标题</small>
            </div>
            <div class="font-family-options" id="fontFamilyGroup" role="group" aria-label="文章字体">
              <button type="button" data-font-family="theme">跟随主题</button>
              <button type="button" data-font-family="sans">清晰黑体</button>
              <button type="button" data-font-family="serif">刊物宋体</button>
              <button type="button" data-font-family="kai">人文楷体</button>
            </div>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="exportSettingsTitle">
          <div class="settings-section__heading">
            <div>
              <h3 id="exportSettingsTitle">输出背景</h3>
              <p>预览与复制到公众号的 HTML 保持一致。</p>
            </div>
          </div>

          <div class="background-options" role="radiogroup" aria-label="背景样式">
            <label class="background-option">
              <input type="radio" name="backgroundStyle" value="warm" />
              <span class="background-option__preview is-warm"></span>
              <span><strong>柔雾白</strong><small>苹果风默认的暖白底色</small></span>
            </label>
            <label class="background-option">
              <input type="radio" name="backgroundStyle" value="grid" />
              <span class="background-option__preview is-grid"></span>
              <span><strong>方格纸</strong><small>清楚、带手账质感；微信深色模式下不显示格线</small></span>
            </label>
            <label class="background-option">
              <input type="radio" name="backgroundStyle" value="none" />
              <span class="background-option__preview is-none"></span>
              <span><strong>无背景</strong><small>透明、沿用目标样式</small></span>
            </label>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="localeSettingsTitle">
          <div class="settings-section__heading">
            <div>
              <h3 id="localeSettingsTitle">输出文字</h3>
              <p>文末「注释」「参考链接」标题与脚注标记的字形。</p>
            </div>
          </div>

          <div class="setting-block">
            <div class="setting-block__label">
              <strong>脚注字形</strong>
              <small>不影响正文内容</small>
            </div>
            <div class="segmented segmented--two" id="localeGroup" role="group" aria-label="脚注字形">
              <button type="button" data-locale="hant">繁体</button>
              <button type="button" data-locale="hans">简体</button>
            </div>
          </div>
        </section>
      </div>
    </aside>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
